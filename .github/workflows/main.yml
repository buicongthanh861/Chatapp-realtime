name: Production cicd fullstackapp

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  tesing-check:
    name: Run tests and check code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # check code backend test
      - name: Install backend dependencies 
        run: npm ci
        working-directory: ./backend
      - name: Run backend tests
        run: npm test
        working-directory: ./backend
      # check code frontend test
      - name: Install frontend dependencies 
        run: npm ci
        working-directory: ./frontend
      - name: Run frontend tests
        run: npm test
        working-directory: ./frontend
      
      #sonarcloud check
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=buicongthanh861_Chatapp-realtime
            -Dsonar.organization=java-woof
            -Dsonar.host.url=https://sonarcloud.io/
      #sonarcloud quality gate check
      - name: SonarCloud Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #synk check backend

      - name: Snyk Scan Backend
        uses: snyk/actions/node@master
        timeout-minutes : 5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN_FULLSTACK }}
        with:
          args: --org=buicongthanh861 --all-projects --severity-threshold=high
        continue-on-error: true
  
  #build and deploy aws
  build-and-deploy:
    name: Build and deploy to AWS
    runs-on: ubuntu-latest
    needs: tesing-check
    timeout-minutes: 20
    if: github.event_name == 'push'

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push Backend Image to Amazon ECR
        id: build-backend-image
        env:
          ECR_REGISTRY: 159749281332.dkr.ecr.ap-southeast-1.amazonaws.com
          ECR_REPOSITORY: project-aws-gitops-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags
      
      - name: Build, tag, and push Frontend Image to Amazon ECR
        id: build-frontend-image
        env:
          ECR_REGISTRY: 159749281332.dkr.ecr.ap-southeast-1.amazonaws.com
          ECR_REPOSITORY: project-aws-gitops-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./frontend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

  gitops-deploy:
    name: Deploy to kubernets using gitops
    runs-on: ubuntu-latest
    needs: build-and-deploy
    timeout-minutes: 20
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          repository: buicongthanh861/Chatapp-Infa
          token: ${{ secrets.CHATAPP_TOKEN }}
          path: Chatapp-Infa
      - name: Debug repo
        run: |
          set -euxo pipefail

          echo "Current directory:"
          pwd

          echo "List files:"
          ls -la

          echo "Infra repo files:"
          ls -la Chatapp-Infa

          echo "Current branch:"
          cd Chatapp-Infa
          git branch
      - name: Show values before update
        run: |
          echo "=== FRONTEND BEFORE ==="
          cat Chatapp-Infa/k8s/frontend/values.yaml

          echo "=== BACKEND BEFORE ==="
          cat Chatapp-Infa/k8s/backend/values.yaml  
      - name: setup yqcli
        run: | 
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
      
      - name: Check yq
        run: yq --version
      
      - name: update k8s deployment file
        run: |
          yq e -i ".image.tag = \"${GITHUB_SHA}\"" Chatapp-Infa/k8s/frontend/values.yaml
          yq e -i ".image.tag = \"${GITHUB_SHA}\"" Chatapp-Infa/k8s/backend/values.yaml
      
      - name: Show values after update
        run: |
          echo "=== FRONTEND AFTER ==="
          cat Chatapp-Infa/k8s/frontend/values.yaml

          echo "=== BACKEND AFTER ==="
          cat Chatapp-Infa/k8s/backend/values.yaml
      
      - name: Git diff
        run: |
          cd Chatapp-Infa
          
          echo "Git status:"
          git status
          echo "Git diff:"
          git diff
      - name: Commit and Push changes
        run: |
          cd Chatapp-Infa
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add .
          git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
          git push origin main
  